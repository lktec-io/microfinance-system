# ─────────────────────────────────────────────────────────────────────────────
#  Microfinance Management System — NEW public hostname
#  microfinance.clixworks.co.tz
#
#  Install as:  /etc/nginx/sites-available/microfinance.clixworks.co.tz
#  Enable with: ln -s /etc/nginx/sites-available/microfinance.clixworks.co.tz \
#                     /etc/nginx/sites-enabled/microfinance.clixworks.co.tz
#
#  This is an ADDITIVE server block. It does NOT touch the existing
#  microfinance.nardio.online block — both hostnames serve the same app
#  (same dist, same backend on 127.0.0.1:8004) during the verification window.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen      80;
    listen [::]:80;
    server_name microfinance.clixworks.co.tz;

    return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;
    server_name microfinance.clixworks.co.tz;

    # ── SSL: existing Cloudflare Origin certificate for *.clixworks.co.tz ────
    #    Do not regenerate or replace these files.
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Frontend build (existing, unchanged) ─────────────────────────────────
    root  /var/www/microfinance-system/client/dist;
    index index.html;

    # ── Upload limit (unchanged from existing config) ────────────────────────
    client_max_body_size 10M;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/json
                    application/javascript application/x-javascript
                    text/xml application/xml application/xml+rss;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── API proxy → existing Node.js backend ─────────────────────────────────
    #    ^~ so that the static-asset regex below can never intercept an
    #    API path that happens to end in .js/.css/.png etc.
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React SPA routing (catch-all) ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
